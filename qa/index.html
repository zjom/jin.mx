<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>Questionnaire</title>
    <script src="/theme.js"></script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div
      id="bar"
      class="bar"
      role="progressbar"
      aria-label="Progress"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    ></div>
    <nav>
      <button id="lang" class="lang" type="button" aria-label="Language" hidden></button>
      <button id="theme" class="theme" type="button" aria-label="Dark mode" aria-pressed="false"></button>
    </nav>
    <main id="stage" class="stage"></main>
    <footer id="foot" class="foot">
      <p class="hint" aria-live="polite"></p>
      <div class="moves">
        <button class="move back" type="button" hidden></button>
        <button class="move next" type="button" hidden></button>
      </div>
    </footer>
  </body>
</html>
